<page-header title="'环境分组详情'" breadcrumbs="[{label:'环境分组', link:'portainer.groups'}, group.Name]" reload="true"> </page-header>

<div class="row">
  <div class="col-sm-12">
    <rd-widget>
      <rd-widget-body>
        <group-form
          loaded="loaded"
          model="group"
          associated-endpoints="associatedEndpoints"
          form-action="update"
          form-action-label="更新分组"
          action-in-progress="state.actionInProgress"
          on-change-environments="(onChangeEnvironments)"
        ></group-form>
      </rd-widget-body>
    </rd-widget>
  </div>
</div>
