<div>
  <div class="form-group pt-3">
    <label for="stack_template" class="col-sm-3 col-lg-2 control-label text-left"> 模板 </label>
    <div class="col-sm-9 col-lg-10 flex flex-col gap-y-1">
      <select
        ng-if="$ctrl.templates.length"
        data-cy="custom-template-selector"
        class="form-control"
        ng-model="$ctrl.value"
        ng-options="template.Id as template.label for template in $ctrl.templates"
        ng-change="$ctrl.handleChangeTemplate($ctrl.value)"
      >
        <option value="" label="选择自定义模板" disabled selected="selected"> </option>
      </select>
      <span ng-if="$ctrl.isLoadFailed">
        <p class="text-warning mb-5 !inline-flex gap-1 !align-top text-xs" ng-if="ctrl.currentUser.isAdmin || ctrl.currentUser.id === ctrl.state.template.CreatedByUserId">
          <pr-icon icon="'alert-triangle'" mode="'warning'" size="'sm'"></pr-icon>自定义模板加载失败，请
          <a ui-sref="kubernetes.templates.custom.edit({id: ctrl.state.templateId})">点击此处</a> 进行配置。</p
        >
        <p class="text-warning mb-5 !inline-flex gap-1 !align-top text-xs" ng-if="!(ctrl.currentUser.isAdmin || ctrl.currentUser.id === ctrl.state.template.CreatedByUserId)">
          <pr-icon icon="'alert-triangle'" mode="'warning'" size="'sm'"></pr-icon>自定义模板无法加载，请联系您的管理员。</p
        >
      </span>
      <span class="small text-muted pt-[7px]" ng-if="!$ctrl.templates.length">
        没有可用的自定义模板。请前往 <a ui-state="$ctrl.newTemplatePath">自定义模板视图</a> 创建模板。
      </span>
    </div>
  </div>

  <!-- description -->
  <div ng-if="$ctrl.selectedTemplate.note">
    <div class="col-sm-12 form-section-title"> 信息 </div>
    <div class="form-group">
      <div class="col-sm-12">
        <div class="template-note" ng-bind-html="$ctrl.selectedTemplate.note"></div>
      </div>
    </div>
  </div>
  <!-- !description -->
</div>
