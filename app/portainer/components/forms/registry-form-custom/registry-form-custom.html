<form class="form-horizontal" name="$ctrl.registryFormCustom" ng-submit="$ctrl.formAction()">
  <div class="col-sm-12 form-section-title"> 重要提示 </div>
  <div class="form-group">
    <span class="col-sm-12 text-muted small">
      Docker 要求您连接到
      <a href="https://distribution.github.io/distribution/about/deploying/#run-an-externally-accessible-registry" target="_blank">安全镜像仓库 (HTTPS)</a>。有关如何连接到非安全镜像仓库 (HTTP) 的详细信息，请参阅
      <a href="https://distribution.github.io/distribution/about/insecure/" target="_blank">Docker 官方文档</a>。
    </span>
  </div>
  <div class="col-sm-12 form-section-title"> 自定义仓库信息 </div>
  <!-- name-input -->
  <div class="form-group">
    <label for="registry_name" class="col-sm-3 col-lg-2 control-label required text-left">仓库名称</label>
    <div class="col-sm-9 col-lg-10">
      <input
        type="text"
        class="form-control"
        id="registry_name"
        name="registry_name"
        ng-model="$ctrl.model.Name"
        placeholder="例如 my-custom-registry"
        required
        auto-focus
        data-cy="component-registryNameInput"
      />
      <div class="help-block" ng-show="$ctrl.registryFormCustom.registry_name.$invalid">
        <div class="small text-warning">
          <div ng-messages="$ctrl.registryFormCustom.registry_name.$error">
            <p ng-message="required" class="vertical-center">
              <pr-icon icon="'alert-triangle'"></pr-icon>
              此字段为必填项。
            </p>
            <p ng-message="used" class="vertical-center">
              <pr-icon icon="'alert-triangle'"></pr-icon>
              已存在同名的镜像仓库。
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- !name-input -->
  <!-- url-input -->
  <div class="form-group">
    <label for="registry_url" class="col-sm-3 col-lg-2 control-label required text-left">
      仓库 URL
      <portainer-tooltip message="'镜像仓库的 URL 或 IP 地址。以 http:// 开头表示保存为 HTTP 仓库，否则默认保存为 HTTPS。'"></portainer-tooltip>
    </label>
    <div class="col-sm-9 col-lg-10">
      <input
        type="text"
        class="form-control"
        id="registry_url"
        name="registry_url"
        ng-model="$ctrl.model.URL"
        placeholder="例如 10.0.0.10:5000 或 myregistry.domain.tld"
        required
        data-cy="component-registryUrlInput"
      />
      <div class="help-block" ng-show="$ctrl.registryFormCustom.registry_url.$invalid">
        <div class="small text-warning">
          <div ng-messages="$ctrl.registryFormCustom.registry_url.$error">
            <p ng-message="required" class="vertical-center">
              <pr-icon icon="'alert-triangle'"></pr-icon>
              此字段为必填项。
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- url-input -->
  <!-- authentication-checkbox -->
  <div class="form-group">
    <div class="col-sm-12">
      <por-switch-field
        label="'身份验证'"
        label-class="'col-sm-3 col-lg-2'"
        tooltip="'如果您需要指定凭据连接到此镜像仓库，请启用此选项。'"
        name="'administrator'"
        checked="$ctrl.model.Authentication"
        on-change="($ctrl.toggleAuthentication)"
        label-class="'col-sm-2'"
      ></por-switch-field>
    </div>
  </div>
  <!-- !authentication-checkbox -->
  <div ng-if="$ctrl.model.Authentication">
    <!-- credentials-user -->
    <div class="form-group">
      <label for="registry_username" class="col-sm-3 col-lg-2 control-label required text-left">用户名</label>
      <div class="col-sm-9 col-lg-10">
        <input
          type="text"
          class="form-control"
          id="registry_username"
          name="registry_username"
          ng-model="$ctrl.model.Username"
          required
          data-cy="component-registryUsernameInput"
        />
        <div class="help-block" ng-show="$ctrl.registryFormCustom.registry_username.$invalid">
          <div class="small text-warning">
            <div ng-messages="$ctrl.registryFormCustom.registry_username.$error">
              <p ng-message="required" class="vertical-center">
                <pr-icon icon="'alert-triangle'"></pr-icon>
                此字段为必填项。
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- !credentials-user -->
    <!-- credentials-password -->
    <div class="form-group">
      <label for="registry_password" class="col-sm-3 col-lg-2 control-label required text-left">密码</label>
      <div class="col-sm-9 col-lg-10">
        <input type="password" class="form-control" id="registry_password" name="registry_password" ng-model="$ctrl.model.Password" required />
        <div class="help-block" ng-show="$ctrl.registryFormCustom.registry_password.$invalid">
          <div class="small text-warning">
            <div ng-messages="$ctrl.registryFormCustom.registry_password.$error">
              <p ng-message="required" class="vertical-center">
                <pr-icon icon="'alert-triangle'"></pr-icon>
                此字段为必填项。
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- !credentials-password -->
  </div>
  <!-- actions -->
  <div class="col-sm-12 form-section-title"> 操作 </div>
  <div class="form-group">
    <div class="col-sm-12">
      <button
        type="submit"
        class="btn btn-primary btn-sm"
        ng-disabled="$ctrl.actionInProgress || !$ctrl.registryFormCustom.$valid"
        button-spinner="$ctrl.actionInProgress"
        analytics-on
        analytics-category="portainer"
        analytics-event="portainer-registry-creation"
        analytics-properties="{ metadata: { type: 'custom' }}"
      >
        <span ng-hide="$ctrl.actionInProgress">{{ $ctrl.formActionLabel }}</span>
        <span ng-show="$ctrl.actionInProgress">正在处理...</span>
      </button>
    </div>
  </div>
  <!-- !actions -->
</form>
